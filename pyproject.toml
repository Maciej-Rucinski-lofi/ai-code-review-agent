[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-intelligence-platform"
version = "0.1.0"
description = "Historical pull request collection and AI review benchmarking platform"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
